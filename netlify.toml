[build]
  command = "npm run build"
  publish = ".next"
  functions = ".netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Set the backend URL in Netlify environment variables:
#   NEXT_PUBLIC_API_URL = https://<your-railway-backend>.up.railway.app
# The frontend will use this value without needing to append extra slashes.
